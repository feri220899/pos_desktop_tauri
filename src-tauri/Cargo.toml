[package]
name = "pos-desktop-tauri"
version = "0.1.0"
description = "POS Desktop"
authors = ["feri@bphmigas.com"]
edition = "2021"

[lib]
name = "pos_desktop_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
jsonwebtoken = "9"
mac_address = "1.1"
gethostname = "0.4"
